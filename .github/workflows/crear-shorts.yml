name: Crear shorts de GTA 6

on:
  # Se ejecuta solo cuando subes clips o guiones nuevos
  push:
    paths:
      - "clips/**"
      - "guiones/**"
  # Y también a mano desde la pestaña Actions
  workflow_dispatch:
    inputs:
      voz:
        description: "Voz en off (es-ES-AlvaroNeural, es-MX-JorgeNeural, es-ES-ElviraNeural...)"
        default: "es-ES-AlvaroNeural"
      duracion_max:
        description: "Duración máxima del short en segundos"
        default: "59"
      inicio:
        description: "Segundo del clip desde el que empezar"
        default: "0"

jobs:
  shorts:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar ffmpeg y fuentes
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-liberation

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Crear los shorts
        run: |
          python scripts/crear_shorts.py \
            --voz "${{ github.event.inputs.voz || 'es-ES-AlvaroNeural' }}" \
            --duracion-max "${{ github.event.inputs.duracion_max || '59' }}" \
            --inicio "${{ github.event.inputs.inicio || '0' }}"

      - name: Guardar los shorts para descargar
        uses: actions/upload-artifact@v4
        with:
          name: shorts-gta6
          path: shorts/*.mp4
          retention-days: 14
